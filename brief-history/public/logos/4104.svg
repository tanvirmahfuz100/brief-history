<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Background Color -->
  <rect width="100%" height="100%" fill="#7c3aed" />

  <!-- Background Watermark Text -->
  <g fill="#632ebe" opacity="0.6" font-family="'Times New Roman', Times, serif" font-weight="bold">
    <text x="500" y="350" font-size="380" text-anchor="middle" textLength="988" lengthAdjust="spacingAndGlyphs">Supply Chain and Operation</text>
    <text x="500" y="620" font-size="380" text-anchor="middle" textLength="400" lengthAdjust="spacingAndGlyphs">Management</text>
    <text x="500" y="890" font-size="380" text-anchor="middle" textLength="400" lengthAdjust="spacingAndGlyphs"></text>
  </g>

  <!-- Top Left Yellow Square -->
  <rect x="0" y="0" width="141" height="141" fill="#f9c77c" />

  <!-- Foreground Main Text -->
  <g fill="#ffffff" font-family="'Times New Roman', Times, serif">
    
    <!-- Large Number "4104" -->
    <text x="45" y="480" font-size="390" text-anchor="start" letter-spacing="-12">4104</text>

    <!-- Title Text Block -->
    <g font-size="112" text-anchor="start">
      <text x="45" y="630" textLength="2912" lengthAdjust="spacingAndGlyphs">Supply Chain and Operation</text>
      <text x="45" y="740" textLength="1120" lengthAdjust="spacingAndGlyphs">Management</text>
      <text x="45" y="850" textLength="0" lengthAdjust="spacingAndGlyphs"></text>
    </g>
  </g>
</svg>